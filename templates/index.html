<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keen Cortex Pro</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#07111f;
color:#fff;
}
header{
padding:24px;
border-bottom:1px solid #1d3047;
background:#0a1728;
}
.logo{
font-size:26px;
font-weight:800;
}
.logo span{color:#19d3ae}
.tagline{
margin-top:6px;
color:#8da2ba;
}
main{
max-width:1000px;
margin:auto;
padding:30px 20px;
}
.hero{
text-align:center;
padding:30px 10px;
}
.hero h1{
font-size:38px;
margin:10px 0;
}
.hero p{
color:#9cafc5;
font-size:17px;
}
.analyzer{
background:#0d1b2e;
border:1px solid #20364f;
border-radius:18px;
padding:24px;
}
input{
width:100%;
padding:16px;
border-radius:10px;
border:1px solid #304a66;
background:#081525;
color:#fff;
font-size:16px;
}
button{
margin-top:14px;
width:100%;
padding:16px;
border:0;
border-radius:10px;
background:#19d3ae;
color:#03120f;
font-size:16px;
font-weight:800;
}
</style>
<style>.pro-badge{display:inline-block;padding:6px 12px;border:1px solid #19d3ae;border-radius:20px;color:#19d3ae;font-size:11px;font-weight:800;letter-spacing:1px;margin-left:10px}.scorebar{height:7px;background:#152235;border-radius:10px;overflow:hidden;margin-top:10px}.scorefill{height:100%;border-radius:10px;background:#19d3ae}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.actions button{flex:1;min-width:150px;padding:13px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.actions .primary{background:#19d3ae;color:#041018}.actions .secondary{background:#142237;color:#fff;border:1px solid #263952}.good{color:#19d3ae}.warning{color:#ffbd59}.bad{color:#ff6f75}.pro-intelligence{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:18px}.intel-card{background:#0b1727;border:1px solid #1a2d44;border-radius:12px;padding:15px}.intel-card small{display:block;color:#7890aa;font-size:11px;text-transform:uppercase;margin-bottom:7px}.intel-card strong{font-size:18px}.pro-actions{margin-top:25px}@media(max-width:600px){.actions button{min-width:100%}}</style></head>
<body>

<header>
  <div class="logo">KEEN <span>CORTEX PRO</span></div>
  <div class="tagline">AI-Powered Website Intelligence</div>
</header>

<main>

<section class="hero">
  <h1>Analyze Any Website</h1>
  <p>Discover SEO, content, technical, accessibility and performance opportunities.</p>
</section>

<section class="analyzer">
  <input id="url" type="url" placeholder="https://example.com">
  <button onclick="analyze()">ANALYZE WEBSITE</button>

  <div id="status"></div>
  <div id="results"></div>
</section>

</main>

<script>
async function analyze(){

  const url = document.getElementById("url").value.trim();
  const status = document.getElementById("status");
  const results = document.getElementById("results");

  if(!url){
    status.innerHTML = "<p>Please enter a website URL.</p>";
    return;
  }

  status.innerHTML = "<p>Analyzing website...</p>";
  results.innerHTML = "";

  try {

    const response = await fetch("/api/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({url: url})
    });

    const data = await response.json();

    if(!response.ok || data.success === false){
      throw new Error(data.error || "Analysis failed");
    }

    results.innerHTML = `
      <div style="margin-top:30px">

        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:15px;
          flex-wrap:wrap;
          margin-bottom:20px;
        ">
          <div>
            <div style="color:#19d3ae;font-size:13px;font-weight:800;letter-spacing:1px">
              ANALYSIS COMPLETE
            </div>
            <h2 style="margin:6px 0">${data.title || "Website Analysis"}</h2>
            <div style="color:#8da2ba;font-size:14px">${data.domain || data.url || ""}</div>
          </div>

          <div style="
            background:#19d3ae;
            color:#03120f;
            padding:12px 18px;
            border-radius:12px;
            font-weight:900;
            text-align:center;
          ">
            <div style="font-size:12px">OVERALL SCORE</div>
            <div style="font-size:34px">${data.overall_score ?? "N/A"}</div>
          </div>
        </div>

        <div style="
          display:grid;
          grid-template-columns:repeat(2,1fr);
          gap:12px;
          margin-top:20px;
        ">

          <div style="background:#12243a;padding:18px;border-radius:12px">
            <div>Overall</div>
            <strong style="font-size:30px">${data.overall_score ?? "N/A"}</strong>
            <div style="color:#8da2ba;font-size:12px;margin-top:5px">Overall health</div>
          </div>

          <div style="background:#12243a;padding:18px;border-radius:12px">
            <div>SEO</div>
            <strong style="font-size:30px">${data.scores.seo ?? "N/A"}</strong>
            <div style="color:#8da2ba;font-size:12px;margin-top:5px">Search visibility</div>
          </div>

          <div style="background:#12243a;padding:18px;border-radius:12px">
            <div>Content</div>
            <strong style="font-size:30px">${data.scores.content ?? "N/A"}</strong>
            <div style="color:#8da2ba;font-size:12px;margin-top:5px">Content quality</div>
          </div>

          <div style="background:#12243a;padding:18px;border-radius:12px">
            <div>Technical</div>
            <strong style="font-size:30px">${data.scores.technical ?? "N/A"}</strong>
            <div style="color:#8da2ba;font-size:12px;margin-top:5px">Technical health</div>
          </div>

          <div style="background:#12243a;padding:18px;border-radius:12px">
            <div>Accessibility</div>
            <strong style="font-size:30px">${data.scores.accessibility ?? "N/A"}</strong>
            <div style="color:#8da2ba;font-size:12px;margin-top:5px">Accessibility health</div>
          </div>

          <div style="background:#12243a;padding:18px;border-radius:12px">
            <div>Performance</div>
            <strong style="font-size:30px">${data.scores.performance ?? "N/A"}</strong>
            <div style="color:#8da2ba;font-size:12px;margin-top:5px">Speed & response</div>
          </div>

        </div>

        <div style="
          margin-top:20px;
          background:#12243a;
          padding:20px;
          border-radius:12px;
        ">

          <h3>Website Intelligence</h3>

          <p><strong>Title:</strong> ${data.title || "Missing"}</p>
          <p><strong>Description:</strong> ${data.description || "Missing"}</p>
          <p><strong>H1 Count:</strong> ${data.statistics.h1_count ?? "N/A"}</p>
          <p><strong>H2 Count:</strong> ${data.statistics.h2_count ?? "N/A"}</p>
          <p><strong>Images:</strong> ${data.statistics.image_count ?? "N/A"}</p>
          <p><strong>Missing Alt Text:</strong> ${data.statistics.images_without_alt ?? "N/A"}</p>
          <p><strong>Links:</strong> ${data.statistics.link_count ?? "N/A"}</p>
          <p><strong>Word Count:</strong> ${data.statistics.word_count ?? "N/A"}</p>
          <p><strong>HTTPS:</strong> ${data.https ? "Yes" : "No"}</p>
          <p><strong>Response Time:</strong> ${data.statistics.response_time ?? "N/A"}s</p>

        </div>

        <div style="
          margin-top:20px;
          background:#12243a;
          padding:20px;
          border-radius:12px;
        ">
          <h3>Priority Recommendations</h3>

          ${
            (data.recommendations && data.recommendations.length)
            ? data.recommendations.map((item,index)=>`
              <div style="
                margin-top:10px;
                padding:14px;
                background:#0a1728;
                border-left:4px solid #19d3ae;
                border-radius:8px;
              ">
                <strong>#${index+1}</strong>
                <span style="margin-left:8px">${item}</span>
              </div>
            `).join("")
            : "<p style='color:#19d3ae'>No major recommendations. Good job!</p>"
          }
        </div>

      </div>
    `;

    status.innerHTML = "<p>Analysis complete.</p>";

  } catch(error) {

    status.innerHTML =
      "<p style='color:#ff7070'>" +
      error.message +
      "</p>";

  }
}
</script>
</body>
</html>
